[project]
name = "drishyam-backend"
version = "0.1.0"
description = "Standalone NyayTrace / DRISHYAM cybercrime evidence intelligence backend"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"
